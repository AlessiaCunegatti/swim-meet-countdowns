<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swim Meet Countdown</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <p class="eyebrow">SWIM &amp; DIVE</p>
    <h1>Meet Countdown</h1>
    <p class="intro">Get ready for race day. Add your next meet below.</p>

<form id="meet-form" class="form">
  <label for="meet-name">Choose your next meet</label>

  <select id="meet-name" required>
    <option value="">Select a meet</option>
    <option value="tyr">TYR '85 Invite</option>
    <option value="gs">Georgia Southern</option>
    <option value="queens">Queens (Diving)</option>
    <option value="gw">Gardner-Webb (Swimming)</option>
    <option value="gsd">Georgia Southern (Diving)</option>
    <option value="uncp">UNC Pembroke</option>
    <option value="asun">ASUN Conference Championships</option>
  </select>

  <button type="submit">Start countdown</button>
</form>
